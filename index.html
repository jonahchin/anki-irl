<style>

*{box-sizing:border-box}[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans",system-ui,sans-serif;margin:0 auto;max-width:640px;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));line-height:1.55}

button.t.on{background:var(--pink2);color:#fff}
.row{display:flex;gap:8px}.row .pick{flex:1}
.pick{display:block;text-align:center;padding:13px;border-radius:14px;background:var(--soft);font-weight:600}
textarea,input[type=text]{width:100%;font-size:1rem;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:12px;padding:10px;margin:4px 0}
textarea{height:90px}

.mut{color:var(--mut);font-size:.85rem}

.frame img{max-width:100%;max-height:100%;object-fit:contain}

<body>

<div class="card">

<script>
var $=function(i){return document.getElementById(i)},DB,TAGS={},T='',cur=null,enc=encodeURIComponent,JM=/^JMdict/i;
var esc=function(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')};
var req=function(r){return new Promise(function(ok,no){r.onsuccess=function(){ok(r.result)};r.onerror=function(){no(r.error)}})};
var done=function(t){return new Promise(function(ok,no){t.oncomplete=ok;t.onerror=t.onabort=function(){no(t.error)}})};
var IL={},st=function(m){IL={};$('st').textContent=m};
var S=function(n,w){return DB.transaction(n,w?'readwrite':'readonly').objectStore(n)};
function openDB(){return new Promise(function(ok,no){var r=indexedDB.open('mining',1);
 r.onupgradeneeded=function(){var d=r.result;
  var t=d.createObjectStore('terms',{autoIncrement:true});t.createIndex('e','e');t.createIndex('r','r');
  d.createObjectStore('meta',{autoIncrement:true}).createIndex('e','e');
  d.createObjectStore('dicts',{keyPath:'t'});};
 r.onsuccess=function(){ok(r.result)};r.onerror=function(){no(r.error)};});}
async function refresh(){var d=await req(S('dicts').getAll());d.forEach(function(x){Object.assign(TAGS,x.tags||{})});$('dl').textContent=d.length?'Imported: '+d.map(function(x){return x.t}).join(', '):'No dictionaries imported'}

/* ---------- import ---------- */
var curKey='';
function line(k,m){IL[k]=m;$('st').textContent=Object.keys(IL).map(function(x){return x+': '+IL[x]}).join('\n')}
async function importZip(file){
 curKey=file.name;line(curKey,'reading zip…');
 var z=await JSZip.loadAsync(file),title=JSON.parse(await z.file('index.json').async('string')).title;
 delete IL[file.name];curKey=title;line(title,'checking…');
 if(await req(S('dicts').get(title))){line(title,'already imported');return}
 var names=Object.keys(z.files).filter(function(n){return /^(term(_meta)?|tag)_bank_\d+\.json$/.test(n)}).sort(function(a,b){return a.localeCompare(b,undefined,{numeric:true})}),tagMap={};
 for(var fi=0;fi<names.length;fi++){
  var f=names[fi];line(title,'saving file '+(fi+1)+' of '+names.length+'…');
  if(f.indexOf('tag_bank')==0){JSON.parse(await z.file(f).async('string')).forEach(function(t){tagMap[t[0]]=t[3]});continue}
  var isT=f.indexOf('term_bank')==0;
  if(isT&&!JM.test(title))continue;
  var rows=JSON.parse(await z.file(f).async('string')),tx=DB.transaction(['terms','meta'],'readwrite'),T1=tx.objectStore('terms'),M=tx.objectStore('meta');
  rows.forEach(function(r){
   if(isT)T1.put({d:title,e:r[0],r:r[1]||r[0],t:r[2],ru:r[3],g:r[5],q:r[6],tt:r[7]});
   else if(r[1]=='freq'){var x=r[2],rd,fq=x;if(x&&x.reading!==undefined){rd=x.reading;fq=x.frequency}
    var o=fq&&typeof fq=='object',v=o?fq.value:fq,dv=o&&fq.displayValue!=null?fq.displayValue:v;
    M.put({d:title,e:r[0],m:'f',rd:rd,v:v,dv:String(dv)})}
   else if(r[1]=='pitch'&&r[2]&&r[2].pitches)M.put({d:title,e:r[0],m:'p',rd:r[2].reading,ps:r[2].pitches.map(function(p){return p.position})});
  });
  await done(tx);
 }
 await req(S('dicts',1).put({t:title,tags:tagMap}));line(title,'✓ done');
}
$('zips').onchange=async function(e){var fs=Array.from(e.target.files);IL={};
 for(var f of fs){try{await importZip(f)}catch(x){line(curKey,'✗ '+x.message)}
  await new Promise(function(r){setTimeout(r,400)})}
 refresh();e.target.value=''};
$('clr').onclick=async function(){if(!confirm('Delete all dictionaries?'))return;
 var tx=DB.transaction(['terms','meta','dicts'],'readwrite');['terms','meta','dicts'].forEach(function(n){tx.objectStore(n).clear()});
 await done(tx);refresh();st('Cleared')};

/* ---------- deinflection ---------- */
var G={う:['わ','い','え','お','って','った'],く:['か','き','け','こ','いて','いた'],ぐ:['が','ぎ','げ','ご','いで','いだ'],す:['さ','し','せ','そ','して','した'],つ:['た','ち','て','と','って','った'],ぬ:['な','に','ね','の','んで','んだ'],ぶ:['ば','び','べ','ぼ','んで','んだ'],む:['ま','み','め','も','んで','んだ'],る:['ら','り','れ','ろ','って','った']};
var R=[],rl=function(f,t,ty){R.push([f,t,ty])};
Object.keys(G).forEach(function(e){var g=G[e];
 ['ない','なかった','なくて','ず','れる','せる'].forEach(function(s){rl(g[0]+s,e,'v5')});
 ['ます','ました','ません','ませんでした','ましょう','たい','たくない','たかった','ながら'].forEach(function(s){rl(g[1]+s,e,'v5')});
 rl(g[2]+'ば',e,'v5');rl(g[3]+'う',e,'v5');rl(g[4],e,'v5');rl(g[5],e,'v5');
 ['いる','いた','いない'].forEach(function(s){rl(g[4]+s,e,'v5')});});
rl('行って','行く','v5');rl('行った','行く','v5');
['ない','なかった','なくて','ます','ました','ません','ませんでした','ましょう','て','た','ず','れば','よう','ろ','られる','させる','たい','たくない','たかった','ている','ていた','ていない','てる','てた'].forEach(function(s){rl(s,'る','v1')});
['しない','しなかった','した','して','します','しました','しません','しよう','すれば','しろ','させる','される','している','していた'].forEach(function(s){rl(s,'する','')});
['くない','くなかった','かった','くて','ければ','く'].forEach(function(s){rl(s,'い','adj-i')});
function deinf(s){var o=[];R.forEach(function(r){if(s.length>r[0].length&&s.endsWith(r[0]))o.push({c:s.slice(0,-r[0].length)+r[1],ty:r[2]})});return o}

/* ---------- lookup ---------- */
async function find(text,i){var out=[];
 for(var L=Math.min(14,text.length-i);L>=1;L--){
  var s=text.substr(i,L),cs=[{c:s,ty:''}].concat(deinf(s)),rows=[];
  for(var o of cs){
   var a=await req(S('terms').index('e').getAll(o.c));
   if(!a.length&&/^[\u3040-\u30ff]+$/.test(o.c))a=await req(S('terms').index('r').getAll(o.c));
   if(o.ty)a=a.filter(function(r){return (r.ru||'').split(' ').indexOf(o.ty)>=0});
   rows=rows.concat(a);
  }
  if(rows.length)out.push({L:L,rows:rows});
 }
 return out}
function groups(rows){var m=new Map();rows.forEach(function(r){var k=[r.e,r.r,r.q].join('|');
 if(!m.has(k))m.set(k,{e:r.e,r:r.r,rows:[]});m.get(k).rows.push(r)});return Array.from(m.values())}
async function meta(e,r){
 var a=await req(S('meta').index('e').getAll(e)),fr=[],seen={},ps=[];
 a.forEach(function(x){if(x.rd!==undefined&&x.rd!=r)return;
  if(x.m=='f'){var k=[x.d,x.rd,x.v,x.dv].join('|');if(!seen[k]){seen[k]=1;fr.push(x)}}
  else x.ps.forEach(function(p){if(ps.indexOf(p)<0)ps.push(p)});});
 return {fr:fr,ps:ps}}
function fsort(fr){var b={};fr.forEach(function(x){if(typeof x.v=='number'&&(!b[x.d]||x.v<b[x.d]))b[x.d]=x.v});
 var v=Object.keys(b).map(function(k){return b[k]});
 return v.length?Math.floor(v.length/v.reduce(function(s,x){return s+1/x},0)):''}
var mora=function(s){return Array.from(s).filter(function(c){return 'ゃゅょぁぃぅぇぉャュョァィゥェォ'.indexOf(c)<0}).length};

/* ---------- field builders ---------- */
function furi(e,r){
 if(e==r||!/[\u4e00-\u9fff]/.test(e))return e;
 var k=function(c){return /[\u3040-\u30ff]/.test(c)},p=0,s=0;
 while(p<e.length&&k(e[p])&&e[p]==r[p])p++;
 while(s<e.length-p&&k(e[e.length-1-s])&&e[e.length-1-s]==r[r.length-1-s])s++;
 return e.slice(0,p)+(p?' ':'')+e.slice(p,e.length-s)+'['+r.slice(p,r.length-s)+']'+e.slice(e.length-s)}
function sc(n){
 if(n==null)return '';
 if(typeof n=='string')return esc(n);
 if(Array.isArray(n))return n.map(sc).join('');
 if(n.type=='structured-content')return sc(n.content);
 if(!n.tag)return sc(n.content);
 if(n.tag=='br')return '<br>';
 var a='';
 if(n.data)Object.keys(n.data).forEach(function(k){a+=' data-sc-'+k+'="'+esc(n.data[k])+'"'});
 if(n.lang)a+=' lang="'+esc(n.lang)+'"';
 if(n.href)a+=' href="#"';
 if(n.style)a+=' style="'+esc(Object.keys(n.style).map(function(k){return k.replace(/[A-Z]/g,function(m){return '-'+m.toLowerCase()})+': '+n.style[k]+';'}).join(' '))+'"';
 return '<'+n.tag+a+'>'+sc(n.content)+'</'+n.tag+'>'}
function defn(rows){
 var li=rows.map(function(r,i){var inner='',sl=[];
  (r.g||[]).forEach(function(x){if(typeof x=='string')sl.push(x);else if(x.type=='text')sl.push(x.text);else inner+=sc(x.content)});
  if(sl.length)inner='<ul>'+sl.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>'+inner;
  var tags=(r.t||'').split(' ').filter(Boolean);
  return '<li data-dictionary="'+esc(r.d)+'"><i>('+[i+1].concat(tags,[r.d]).map(esc).join(', ')+')</i> <span>'+inner+'</span></li>'}).join('');
 return '<div style="text-align: left;" class="yomitan-glossary"><ol>'+li+'</ol></div>'}
function sentence(i,L){var a=i,b=i+L,end=/[。！？\n]/;
 while(a>0&&!end.test(T[a-1]))a--;
 while(b<T.length&&!end.test(T[b]))b++;
 if(b<T.length&&T[b]!='\n')b++;
 return esc(T.slice(a,i))+'<b>'+esc(T.slice(i,i+L))+'</b>'+esc(T.slice(i+L,b))}

/* ---------- UI ---------- */
var img0=new Image(),sel=null,drag=false,autoHid=false,RECT=null,picCache={},audioC={},SMALL_W=600,SMALL_Q=0.6,PAD=0.4,MODES=['tight','padded','whole'],pm='padded',AU=true;
try{pm=localStorage.getItem('pm')||'padded';AU=localStorage.getItem('au')!=='0'}catch(e){}
$('pm').value=pm;$('au').checked=AU;
$('pm').onchange=function(){pm=this.value;try{localStorage.setItem('pm',pm)}catch(e){}};
$('au').onchange=function(){AU=this.checked;try{localStorage.setItem('au',AU?'1':'0')}catch(e){}};
$('photo').onchange=$('cam').onchange=function(e){var f=e.target.files[0];if(!f)return;
 img0=new Image();img0.onload=function(){$('pimg').src=img0.src;$('cw').hidden=false;$('crop').hidden=true;$('recrop').hidden=true;$('hidebtn').hidden=true;autoHid=false;$('box').style.display='none';sel=null;RECT=null;picCache={}};
 img0.src=URL.createObjectURL(f)};
var pt=function(e){var r=$('pimg').getBoundingClientRect();return {x:Math.max(0,Math.min(r.width,e.clientX-r.left)),y:Math.max(0,Math.min(r.height,e.clientY-r.top))}};
function drawBox(){var b=$('box').style,a=sel.a,c=sel.b;b.display='block';b.left=Math.min(a.x,c.x)+'px';b.top=Math.min(a.y,c.y)+'px';b.width=Math.abs(a.x-c.x)+'px';b.height=Math.abs(a.y-c.y)+'px'}
$('stage').onpointerdown=function(e){this.setPointerCapture(e.pointerId);drag=true;sel={a:pt(e),b:pt(e)};drawBox()};
$('stage').onpointermove=function(e){if(drag){sel.b=pt(e);drawBox()}};
$('stage').onpointerup=function(){drag=false};
$('cropbtn').onclick=function(){
 var k=img0.naturalWidth/$('pimg').getBoundingClientRect().width,x=0,y=0,w=img0.naturalWidth,h=img0.naturalHeight;
 if(sel){var bw=Math.abs(sel.a.x-sel.b.x),bh=Math.abs(sel.a.y-sel.b.y);
  if(bw>10&&bh>10){x=Math.min(sel.a.x,sel.b.x)*k;y=Math.min(sel.a.y,sel.b.y)*k;w=bw*k;h=bh*k}}
 RECT={x:x,y:y,w:w,h:h};picCache={};
 var c=document.createElement('canvas'),m=Math.min(1,2000/w);c.width=Math.round(w*m);c.height=Math.round(h*m);
 c.getContext('2d').drawImage(img0,x,y,w,h,0,0,c.width,c.height);
 c.toBlob(function(b){$('crop').src=URL.createObjectURL(b);$('crop').hidden=false;$('cw').hidden=true;$('recrop').hidden=false;$('hidebtn').hidden=false;$('hidebtn').textContent='Hide photo';autoHid=false},'image/jpeg',0.92)};
$('recrop').onclick=function(){$('cw').hidden=false;$('crop').hidden=true;$('recrop').hidden=true;$('hidebtn').hidden=true};
function setPhoto(v){$('crop').hidden=!v;$('hidebtn').textContent=v?'Hide photo':'Show photo'}
$('hidebtn').onclick=function(){setPhoto($('crop').hidden)};
function picFor(mode){
 if(!RECT)return '';if(picCache[mode])return picCache[mode];
 var R=RECT,x=R.x,y=R.y,w=R.w,h=R.h,W=img0.naturalWidth,H=img0.naturalHeight;
 if(mode=='whole'){x=0;y=0;w=W;h=H}
 else if(mode=='padded'){var px=w*PAD,py=h*PAD;x=Math.max(0,R.x-px);y=Math.max(0,R.y-py);w=Math.min(W,R.x+R.w+px)-x;h=Math.min(H,R.y+R.h+py)-y}
 var c=document.createElement('canvas'),r=Math.min(1,SMALL_W/w);c.width=Math.round(w*r);c.height=Math.round(h*r);
 c.getContext('2d').drawImage(img0,x,y,w,h,0,0,c.width,c.height);
 return picCache[mode]=c.toDataURL('image/jpeg',SMALL_Q)}

/* ---------- audio (Lingua Libre via Wikimedia) ---------- */
async function api(p){return (await fetch('https://commons.wikimedia.org/w/api.php?origin=*&format=json&'+new URLSearchParams(p))).json()}
async function wavToMp3(blob){
 var ac=new (window.AudioContext||window.webkitAudioContext)(),buf=await ac.decodeAudioData(await blob.arrayBuffer());ac.close();
 var sr=22050,off=new OfflineAudioContext(1,Math.ceil(buf.duration*sr),sr),src=off.createBufferSource();src.buffer=buf;src.connect(off.destination);src.start();
 var f=(await off.startRendering()).getChannelData(0),pcm=new Int16Array(f.length),i;
 for(i=0;i<f.length;i++){var v=Math.max(-1,Math.min(1,f[i]));pcm[i]=v<0?v*32768:v*32767}
 var enc=new lamejs.Mp3Encoder(1,sr,32),parts=[],o;
 for(i=0;i<pcm.length;i+=1152){o=enc.encodeBuffer(pcm.subarray(i,i+1152));if(o.length)parts.push(o)}
 o=enc.flush();if(o.length)parts.push(o);
 return new Blob(parts,{type:'audio/mpeg'})}
async function findAudio(w){
 var s=await api({action:'query',list:'search',srnamespace:6,srlimit:20,srsearch:'LL-Q5287 (jpn) '+w}),
  t=s.query.search.map(function(x){return x.title.replace(/^File:/,'')}).filter(function(n){return n.endsWith('-'+w+'.wav')});
 if(!t.length)return '';
 var q=await api({action:'query',prop:'imageinfo',iiprop:'url',titles:'File:'+t[0]}),ii=Object.values(q.query.pages)[0].imageinfo[0],
  mp3=await wavToMp3(await (await fetch(ii.url)).blob());
 var h=await new Promise(function(ok){var fr=new FileReader();fr.onload=function(){ok('<audio controls src="'+fr.result+'"></audio>')};fr.readAsDataURL(mp3)});
 return h.length>40000?'':h}
function loadAudio(w){findAudio(w).then(function(h){audioC[w]=h}).catch(function(){audioC[w]=''}).then(function(){if(cur&&cur.gs&&cur.gs[cur.n].e==w)draw()})}

/* ---------- text + card ---------- */
$('txt').oninput=function(){if(RECT&&!autoHid&&$('cw').hidden&&!$('crop').hidden){setPhoto(false);autoHid=true}T=$('txt').value.trim();
 $('out').innerHTML=T.split('').map(function(c,i){return c=='\n'?'<br>':'<span data-i="'+i+'">'+esc(c)+'</span>'}).join('');
 $('card').hidden=true};
$('out').onclick=async function(e){
 var i=e.target.dataset.i;if(i==null||!DB)return;i=+i;
 var ms=await find(T,i);
 if(!ms.length){$('card').hidden=false;$('card').innerHTML='<p>No match</p>';return}
 cur={i:i,ms:ms};await pick(0)};
async function pick(mi){
 var m=cur.ms[mi];cur.mi=mi;
 document.querySelectorAll('#out .hl').forEach(function(x){x.classList.remove('hl')});
 for(var k=cur.i;k<cur.i+m.L;k++){var s=$('out').querySelector('[data-i="'+k+'"]');if(s)s.classList.add('hl')}
 var gs=groups(m.rows);
 for(var g of gs){var d=await meta(g.e,g.r);g.fr=d.fr;g.ps=d.ps;g.fs=fsort(d.fr)}
 gs.sort(function(a,b){return (a.fs||1e12)-(b.fs||1e12)});
 cur.gs=gs;cur.n=0;cur.sentence=sentence(cur.i,m.L);draw()}
var sp=function(p){return '<span style="display:inline;"><span>[</span><span>'+p+'</span><span>]</span></span>'};
function draw(){
 var g=cur.gs[cur.n],cat=g.ps.map(function(p){return p==0?'heiban':p==1?'atamadaka':p==mora(g.r)?'odaka':'nakadaka'}).join(',');
 if(AU&&audioC[g.e]===undefined){audioC[g.e]=null;loadAudio(g.e)}
 var au=AU?audioC[g.e]:'',pic=picFor(pm),tt=[];
 g.rows.forEach(function(r){(r.tt||'').split(' ').forEach(function(x){if(x&&tt.indexOf(x)<0)tt.push(x)})});
 var F={Expression:g.e,ExpressionFurigana:furi(g.e,g.r),ExpressionReading:g.r,Sentence:cur.sentence,MainDefinition:defn(g.rows),
  Frequency:g.fr.length?'<ul style="text-align: left;">'+g.fr.map(function(x){return '<li>'+esc(x.d)+': '+esc(x.dv)+'</li>'}).join('')+'</ul>':'',
  FreqSort:String(g.fs),
  PitchPosition:g.ps.length==1?sp(g.ps[0]):g.ps.length?'<ol>'+g.ps.map(function(p){return '<li>'+sp(p)+'</li>'}).join('')+'</ol>':'',
  PitchCategories:cat,IsClickCard:'y',Picture:pic?'<img src="'+pic+'">':'',ExpressionAudio:au||''};
 cur.F=F;
 var lens=cur.ms.length>1?'<div>'+cur.ms.map(function(m,j){return '<button class="t'+(j==cur.mi?' on':'')+'" data-m="'+j+'">'+esc(T.substr(cur.i,m.L))+'</button>'}).join('')+'</div>':'';
 var ents=cur.gs.length>1?'<div>'+cur.gs.map(function(x,j){return '<button class="t'+(j==cur.n?' on':'')+'" data-n="'+j+'">'+esc(x.e)+'【'+esc(x.r)+'】</button>'}).join('')+'</div>':'';
 var tags=tt.length?'<div>'+tt.map(function(x){return '<button class="tg" data-tag="'+esc(x)+'">'+esc(x)+'</button>'}).join('')+'</div><div class="mut" id="tagd"></div>':'';
 var thumb=pic?'<div class="frame"><img src="'+pic+'"></div><button class="t" data-pm="1">Photo: '+pm+' ▸</button>':'';
 var aud=AU?'<div class="mut">🔊 '+(au?'audio ready':au===''?'no audio found':'looking for audio…')+'</div>'+(au||''):'';
 $('card').hidden=false;
 $('card').innerHTML=lens+ents+'<h2>'+esc(g.e)+' 【'+esc(g.r)+'】</h2>'+tags+'<div>'+F.PitchPosition+' '+cat+'</div><div>'+F.Frequency+'</div><div>FreqSort: '+(F.FreqSort||'–')+'</div>'+aud+'<div>'+F.Sentence+'</div>'+F.MainDefinition+thumb+'<button id="send">Send to Anki</button>'}
$('card').onclick=function(e){var b=e.target.closest('button');if(!b)return;
 if(b.dataset.m!=null)pick(+b.dataset.m);
 else if(b.dataset.n!=null){cur.n=+b.dataset.n;draw()}
 else if(b.dataset.pm){pm=MODES[(MODES.indexOf(pm)+1)%3];draw()}
 else if(b.dataset.tag){var d=$('tagd'),t=b.dataset.tag+': '+(TAGS[b.dataset.tag]||'no description');d.textContent=d.textContent==t?'':t}
 else if(b.id=='send'){
  var u='anki://x-callback-url/addnote?type='+enc($('ntype').value)+'&deck='+enc($('deck').value)
   +'&x-success='+enc('anki://x-callback-url/search?query='+enc('added:1'));
  Object.keys(cur.F).forEach(function(k){if(cur.F[k]!=='')u+='&fld'+k+'='+enc(cur.F[k])});
  location.href=u}};
['deck','ntype'].forEach(function(k){try{var v=localStorage.getItem(k);if(v)$(k).value=v}catch(e){}
 $(k).onchange=function(){try{localStorage.setItem(k,$(k).value)}catch(e){}}});
openDB().then(function(d){DB=d;refresh()});
var VER='v4';$('ver').textContent='Version '+VER;
function offline(){caches.open('mining-v4').then(function(c){return c.keys()}).then(function(a){$('off').textContent=a.length?'Offline ready ('+a.length+' files saved)':'Offline not ready yet'}).catch(function(){$('off').textContent='Offline not available'})}
if('serviceWorker' in navigator){
 var had=!!navigator.serviceWorker.controller,ban=function(){$('upd').hidden=false};
 $('upd').onclick=function(){location.reload()};
 navigator.serviceWorker.addEventListener('message',function(e){if(e.data=='update')ban()});
 navigator.serviceWorker.addEventListener('controllerchange',function(){if(had)ban()});
 navigator.serviceWorker.register('sw.js').then(function(){setTimeout(offline,1500)}).catch(function(){$('off').textContent='Offline not available'});
}else $('off').textContent='Offline not supported';
</script>
</body>
</html>
