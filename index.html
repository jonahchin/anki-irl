<!DOCTYPE html>
<html lang="ja">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{--bg:#fff5f8;--card:#fff;--fg:#4a3b45;--mut:#9a8791;--pink:#f48fb1;--pink2:#ec6f9d;--soft:#fde4ec;--hl:#ffd6e3;--bd:#f6d3de;--sh:0 4px 14px rgba(236,111,157,.12)}
@media (prefers-color-scheme:dark){:root{--bg:#1d1519;--card:#2a1f25;--fg:#f3e6ec;--mut:#a8949d;--pink:#e57fa6;--pink2:#d96391;--soft:#3a2830;--hl:#5a3345;--bd:#43303a;--sh:none}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans",system-ui,sans-serif;margin:0 auto;max-width:640px;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));line-height:1.55}
h1{font-size:1.4rem;margin:4px 0 14px}h2{font-size:1.4rem;margin:10px 0 4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px;margin:0 0 14px;box-shadow:var(--sh)}
button{display:block;width:100%;margin:8px 0 0;padding:13px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;font-size:1rem;font-weight:600}
button:active{transform:scale(.98)}
button.ghost{background:var(--soft);color:var(--fg)}
button.t{display:inline-block;width:auto;padding:6px 12px;margin:3px 3px 0 0;border-radius:999px;background:var(--soft);color:var(--fg);font-weight:500;font-size:.95rem}
button.t.on{background:var(--pink2);color:#fff}
.row{display:flex;gap:8px;margin-bottom:8px}.row .pick{flex:1}
.pick{display:block;text-align:center;padding:13px;border-radius:14px;background:var(--soft);font-weight:600}
textarea,input[type=text]{width:100%;font-size:1rem;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:12px;padding:10px;margin:4px 0}
textarea{height:90px}
#stage{position:relative;margin:0 auto;background:var(--soft);touch-action:none;user-select:none;-webkit-user-select:none;border-radius:12px;overflow:hidden}
#pimg,#crop{display:block;width:auto;height:auto;max-width:100%;max-height:100%;margin:0;border-radius:12px;-webkit-touch-callout:none}
#box{position:absolute;display:none;border:2px solid var(--pink2);background:rgba(244,143,177,.2);box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
#out{font-size:1.5rem;line-height:2.1;margin-top:8px;word-break:break-all}
.hl{background:var(--hl);border-radius:6px}
#st,#dl,details p{color:var(--mut);font-size:.85rem}
details{color:var(--mut);padding:0 4px}summary{padding:8px 0}
.tg{display:inline-block;width:auto;padding:2px 9px;margin:2px 4px 2px 0;border-radius:8px;background:var(--soft);color:var(--fg);font-size:.8rem;font-weight:500}
.mut{color:var(--mut);font-size:.85rem}
select{font-size:1rem;padding:6px;border-radius:10px;background:var(--bg);color:var(--fg);border:1px solid var(--bd)}
.sticky{position:sticky;bottom:max(12px,env(safe-area-inset-bottom));z-index:5;box-shadow:0 6px 18px rgba(236,111,157,.35)}
.frame{height:220px;display:flex;align-items:center;justify-content:center;background:var(--soft);border-radius:12px;margin-top:8px;overflow:hidden}
.frame img{max-width:100%;max-height:100%;object-fit:contain}
#st{white-space:pre-line}#off,#ver{color:var(--mut);font-size:.85rem}
#upd{position:fixed;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:20;background:var(--pink2);color:#fff;padding:8px 16px;border-radius:999px;font-size:.9rem;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#pv{position:absolute;left:0;top:0;max-width:none;max-height:none;pointer-events:none;-webkit-user-drag:none}
.bar{display:flex;gap:8px;position:sticky;bottom:max(12px,env(safe-area-inset-bottom));z-index:5;padding:8px 0;background:var(--card)}
.bar button{margin:0;flex:1;padding:12px 4px;font-size:.95rem}
.row.small button{margin:0;flex:1;padding:10px 4px;font-size:.9rem}
#pbox{height:40vh;display:flex;align-items:center;justify-content:center;background:var(--soft);border-radius:12px;margin-bottom:8px;overflow:hidden}
.phead{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px;padding:10px 14px;text-align:left}
.pr{margin:2px 0}.pm{display:inline-block;padding:1px 2px;font-size:1.35rem;line-height:1.45}
.ph{border-top:2px solid var(--pink2)}.pd{border-right:2px solid var(--pink2)}
.chips{margin:6px 0}.fc{display:inline-block;background:var(--soft);border-radius:999px;padding:3px 10px;margin:0 4px 4px 0;font-size:.85rem}
.fs{background:var(--pink2);color:#fff;font-weight:600}
</style>
</head>
<body>
<div id="upd" hidden>Update ready, tap to reload</div>
<div style="display:flex;align-items:center;justify-content:space-between"><h1>🌸 Mining</h1><button class="t" id="clearall" style="margin:0 0 14px">Clear</button></div>
<div class="card">
<div class="row"><label class="pick"><input type="file" id="cam" accept="image/*" capture="environment" hidden>📷 Take photo</label><label class="pick"><input type="file" id="photo" accept="image/*" hidden>🖼️ Choose</label></div>
<div id="cw" hidden><div id="stage"><img id="pv" alt=""><div id="box"></div></div>
<div class="bar"><button class="ghost" id="zreset">Reset</button><button class="ghost" id="rot">Rotate</button><button class="ghost" id="ccancel">Cancel</button><button id="cropbtn">Done</button></div></div>
<div id="psec" hidden>
<button class="ghost phead" id="hidebtn"><span>Photo</span><span id="parr">▾</span></button>
<div id="pbody"><div id="pbox"></div>
<div class="row small" id="prow"><button class="ghost" id="pcrop">Crop</button><button class="ghost" id="prot">Rotate</button><button class="ghost" id="unc" hidden>Full photo</button></div></div>
</div>
</div>
<div class="card"><textarea id="txt" placeholder="Paste Japanese text"></textarea>
<div id="out"></div></div>
<div id="card" class="card" hidden></div>
<details id="setup"><summary>⚙️ Setup</summary>
<input type="text" id="deck" placeholder="Deck" value="Mining">
<input type="text" id="ntype" placeholder="Note type" value="Lapis">
<p>Card photo: <select id="pm"><option>tight</option><option>padded</option><option>original</option></select></p>
<p><label><input type="checkbox" id="au"> Fetch word audio</label></p>
<div id="dl"></div>
<p id="warn" hidden>Keep the screen on while importing.</p>
<input type="file" id="zips" accept=".zip" multiple>
<button class="ghost" id="clr">Clear dictionaries</button>
<div id="st"></div>
<div id="off"></div><div id="ver"></div>
</details>

<script>
var $=function(i){return document.getElementById(i)},DB,TAGS={},T='',BR={},cur=null,enc=encodeURIComponent,JM=/^JMdict/i;
var esc=function(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')};
var req=function(r){return new Promise(function(ok,no){r.onsuccess=function(){ok(r.result)};r.onerror=function(){no(r.error)}})};
var done=function(t){return new Promise(function(ok,no){t.oncomplete=ok;t.onerror=t.onabort=function(){no(t.error)}})};
var IL={},st=function(m){IL={};$('st').textContent=m};
var S=function(n,w){return DB.transaction(n,w?'readwrite':'readonly').objectStore(n)};
function openDB(){return new Promise(function(ok,no){var r=indexedDB.open('mining',1);
 r.onupgradeneeded=function(){var d=r.result;
  var t=d.createObjectStore('terms',{autoIncrement:true});t.createIndex('e','e');t.createIndex('r','r');
  d.createObjectStore('meta',{autoIncrement:true}).createIndex('e','e');
  d.createObjectStore('dicts',{keyPath:'t'});};
 r.onsuccess=function(){ok(r.result)};r.onerror=function(){no(r.error)};});}
var EXP=[['JMdict',/^JMdict/i],['JPDBv2㋕',/JPDB/i],['BCCWJ',/BCCWJ/i],['CC100',/CC100/i],['アクセント辞典',/アクセント/]];
async function refresh(){
 var d=await req(S('dicts').getAll()),ts=d.map(function(x){return x.t}),used={},nm={},h='';
 d.forEach(function(x){Object.assign(TAGS,x.tags||{});nm[x.t]=x.n});
 EXP.forEach(function(e){var m=ts.filter(function(t){return e[1].test(t)});m.forEach(function(t){used[t]=1});
  var n=0;m.forEach(function(t){n+=nm[t]||0});h+=(m.length?'✓ ':'○ ')+e[0]+(m.length?(n?' ('+n.toLocaleString()+' entries)':''):' (not added yet)')+'<br>'});
 ts.filter(function(t){return !used[t]}).forEach(function(t){h+='• other: '+esc(t)+'<br>'});
 $('dl').innerHTML=h}

/* ---------- import ---------- */
var curKey='';
function line(k,m){IL[k]=m;$('st').textContent=Object.keys(IL).map(function(x){return x+': '+IL[x]}).join('\n')}
async function importZip(file){
 curKey=file.name;line(curKey,'reading zip…');
 var z=await JSZip.loadAsync(file),title=JSON.parse(await z.file('index.json').async('string')).title;
 delete IL[file.name];curKey=title;line(title,'checking…');
 if(await req(S('dicts').get(title))){line(title,'already imported');return}
 var names=Object.keys(z.files).filter(function(n){return /^(term(_meta)?|tag)_bank_\d+\.json$/.test(n)}).sort(function(a,b){return a.localeCompare(b,undefined,{numeric:true})}),tagMap={},cnt=0;
 for(var fi=0;fi<names.length;fi++){
  var f=names[fi];line(title,'saving file '+(fi+1)+' of '+names.length+'…');
  if(f.indexOf('tag_bank')==0){JSON.parse(await z.file(f).async('string')).forEach(function(t){tagMap[t[0]]=t[3]});continue}
  var isT=f.indexOf('term_bank')==0;
  if(isT&&!JM.test(title))continue;
  var rows=JSON.parse(await z.file(f).async('string')),tx=DB.transaction(['terms','meta'],'readwrite'),T1=tx.objectStore('terms'),M=tx.objectStore('meta');cnt+=rows.length;
  rows.forEach(function(r){
   if(isT)T1.put({d:title,e:r[0],r:r[1]||r[0],t:r[2],ru:r[3],g:r[5],q:r[6],tt:r[7]});
   else if(r[1]=='freq'){var x=r[2],rd,fq=x;if(x&&x.reading!==undefined){rd=x.reading;fq=x.frequency}
    var o=fq&&typeof fq=='object',v=o?fq.value:fq,dv=o&&fq.displayValue!=null?fq.displayValue:v;
    M.put({d:title,e:r[0],m:'f',rd:rd,v:v,dv:String(dv)})}
   else if(r[1]=='pitch'&&r[2]&&r[2].pitches)M.put({d:title,e:r[0],m:'p',rd:r[2].reading,ps:r[2].pitches.map(function(p){return p.position})});
  });
  await done(tx);
 }
 await req(S('dicts',1).put({t:title,tags:tagMap,n:cnt}));line(title,'✓ done');
}
$('zips').onchange=async function(e){var fs=Array.from(e.target.files);IL={};$('warn').hidden=false;
 for(var f of fs){try{await importZip(f)}catch(x){line(curKey,'✗ '+x.message)}
  refresh();await new Promise(function(r){setTimeout(r,400)})}
 refresh();$('warn').hidden=true;e.target.value=''};
$('clr').onclick=async function(){if(!confirm('Delete all dictionaries?'))return;
 st('Clearing… this can take a minute');
 try{var tx=DB.transaction(['terms','meta','dicts'],'readwrite');['terms','meta','dicts'].forEach(function(n){tx.objectStore(n).clear()});
  await done(tx);TAGS={};await refresh();st('Cleared')}
 catch(x){st('Clear failed: '+(x&&x.message||x))}};

/* ---------- deinflection ---------- */
var G={う:['わ','い','え','お','って','った'],く:['か','き','け','こ','いて','いた'],ぐ:['が','ぎ','げ','ご','いで','いだ'],す:['さ','し','せ','そ','して','した'],つ:['た','ち','て','と','って','った'],ぬ:['な','に','ね','の','んで','んだ'],ぶ:['ば','び','べ','ぼ','んで','んだ'],む:['ま','み','め','も','んで','んだ'],る:['ら','り','れ','ろ','って','った']};
var R=[],rl=function(f,t,ty){R.push([f,t,ty])};
Object.keys(G).forEach(function(e){var g=G[e];
 ['ない','なかった','なくて','ず','れる','せる'].forEach(function(s){rl(g[0]+s,e,'v5')});
 ['ます','ました','ません','ませんでした','ましょう','たい','たくない','たかった','ながら'].forEach(function(s){rl(g[1]+s,e,'v5')});
 rl(g[2]+'ば',e,'v5');rl(g[3]+'う',e,'v5');rl(g[4],e,'v5');rl(g[5],e,'v5');
 ['いる','いた','いない'].forEach(function(s){rl(g[4]+s,e,'v5')});});
rl('行って','行く','v5');rl('行った','行く','v5');
['ない','なかった','なくて','ます','ました','ません','ませんでした','ましょう','て','た','ず','れば','よう','ろ','られる','させる','たい','たくない','たかった','ている','ていた','ていない','てる','てた'].forEach(function(s){rl(s,'る','v1')});
['しない','しなかった','した','して','します','しました','しません','しよう','すれば','しろ','させる','される','している','していた'].forEach(function(s){rl(s,'する','')});
['くない','くなかった','かった','くて','ければ','く'].forEach(function(s){rl(s,'い','adj-i')});
function deinf(s){var o=[];R.forEach(function(r){if(s.length>r[0].length&&s.endsWith(r[0]))o.push({c:s.slice(0,-r[0].length)+r[1],ty:r[2]})});return o}

/* ---------- lookup ---------- */
async function find(text,i){var out=[];
 for(var L=Math.min(14,text.length-i);L>=1;L--){
  var s=text.substr(i,L),cs=[{c:s,ty:''}].concat(deinf(s)),rows=[];
  for(var o of cs){
   var a=await req(S('terms').index('e').getAll(o.c));
   if(!a.length&&/^[\u3040-\u30ff]+$/.test(o.c))a=await req(S('terms').index('r').getAll(o.c));
   if(o.ty)a=a.filter(function(r){return (r.ru||'').split(' ').indexOf(o.ty)>=0});
   rows=rows.concat(a);
  }
  if(rows.length)out.push({L:L,rows:rows});
 }
 return out}
function groups(rows){var m=new Map();rows.forEach(function(r){var k=[r.e,r.r,r.q].join('|');
 if(!m.has(k))m.set(k,{e:r.e,r:r.r,rows:[]});m.get(k).rows.push(r)});return Array.from(m.values())}
async function meta(e,r){
 var a=await req(S('meta').index('e').getAll(e)),fr=[],seen={},ps=[];
 a.forEach(function(x){if(x.rd!==undefined&&x.rd!=r)return;
  if(x.m=='f'){var k=[x.d,x.rd,x.v,x.dv].join('|');if(!seen[k]){seen[k]=1;fr.push(x)}}
  else x.ps.forEach(function(p){if(ps.indexOf(p)<0)ps.push(p)});});
 return {fr:fr,ps:ps}}
function fsort(fr){var b={};fr.forEach(function(x){if(typeof x.v=='number'&&(!b[x.d]||x.v<b[x.d]))b[x.d]=x.v});
 var v=Object.keys(b).map(function(k){return b[k]});
 return v.length?Math.floor(v.length/v.reduce(function(s,x){return s+1/x},0)):''}
var mora=function(s){return Array.from(s).filter(function(c){return 'ゃゅょぁぃぅぇぉャュョァィゥェォ'.indexOf(c)<0}).length};

/* ---------- field builders ---------- */
function furi(e,r){
 if(e==r||!/[\u4e00-\u9fff]/.test(e))return e;
 var k=function(c){return /[\u3040-\u30ff]/.test(c)},p=0,s=0;
 while(p<e.length&&k(e[p])&&e[p]==r[p])p++;
 while(s<e.length-p&&k(e[e.length-1-s])&&e[e.length-1-s]==r[r.length-1-s])s++;
 return e.slice(0,p)+(p?' ':'')+e.slice(p,e.length-s)+'['+r.slice(p,r.length-s)+']'+e.slice(e.length-s)}
function sc(n){
 if(n==null)return '';
 if(typeof n=='string')return esc(n);
 if(Array.isArray(n))return n.map(sc).join('');
 if(n.type=='structured-content')return sc(n.content);
 if(!n.tag)return sc(n.content);
 if(n.tag=='br')return '<br>';
 var a='';
 if(n.data)Object.keys(n.data).forEach(function(k){a+=' data-sc-'+k+'="'+esc(n.data[k])+'"'});
 if(n.lang)a+=' lang="'+esc(n.lang)+'"';
 if(n.href)a+=' href="#"';
 if(n.style)a+=' style="'+esc(Object.keys(n.style).map(function(k){return k.replace(/[A-Z]/g,function(m){return '-'+m.toLowerCase()})+': '+n.style[k]+';'}).join(' '))+'"';
 return '<'+n.tag+a+'>'+sc(n.content)+'</'+n.tag+'>'}
function defn(rows){
 var li=rows.map(function(r,i){var inner='',sl=[];
  (r.g||[]).forEach(function(x){if(typeof x=='string')sl.push(x);else if(x.type=='text')sl.push(x.text);else inner+=sc(x.content)});
  if(sl.length)inner='<ul>'+sl.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>'+inner;
  var tags=(r.t||'').split(' ').filter(Boolean);
  return '<li data-dictionary="'+esc(r.d)+'"><i>('+[i+1].concat(tags,[r.d]).map(esc).join(', ')+')</i> <span>'+inner+'</span></li>'}).join('');
 return '<div style="text-align: left;" class="yomitan-glossary"><ol>'+li+'</ol></div>'}
function sentence(i,L){var h='';for(var k=0;k<T.length;k++){if(k>0&&BR[k])h+='<br>';if(k==i)h+='<b>';h+=esc(T[k]);if(k==i+L-1)h+='</b>'}return h}

/* ---------- UI ---------- */
var img0=new Image(),rot90=0,VZ=1,VA=0,TX=0,TY=0,SW=0,SH=0,fit=1,UP=null,BOX=null,prevBox=null,da=null,CR=null,ptrs={},pinch=null,drag=false,autoHid=false,RECT=null,picCache={},audioC={},SMALL_W=600,SMALL_Q=0.6,PAD=0.4,MODES=['tight','padded','original'],pm='padded',AU=true;
try{pm=localStorage.getItem('pm')||'padded';AU=localStorage.getItem('au')!=='0'}catch(e){}
if(pm=='whole')pm='original';$('pm').value=pm;$('au').checked=AU;
$('pm').onchange=function(){pm=this.value;try{localStorage.setItem('pm',pm)}catch(e){}};
$('au').onchange=function(){AU=this.checked;try{localStorage.setItem('au',AU?'1':'0')}catch(e){}};
var lastURL='',PR=null;
function showPhoto(u){if(lastURL)URL.revokeObjectURL(lastURL);lastURL=u;var i=new Image();i.id='crop';i.alt='';i.src=u;$('pbox').innerHTML='';$('pbox').appendChild(i)}
function scaled(c,mx){var m=Math.min(1,mx/Math.max(c.width,c.height));if(m>=1)return c;var o=document.createElement('canvas');o.width=Math.round(c.width*m);o.height=Math.round(c.height*m);o.getContext('2d').drawImage(c,0,0,o.width,o.height);return o}
function refreshPhoto(){
 var c=CR?renderCrop(CR,CR.box,2000):scaled(UP,3000);
 c.toBlob(function(b){showPhoto(URL.createObjectURL(b))},'image/jpeg',0.92);
 $('unc').hidden=!CR;$('psec').hidden=false;setPhoto(true)}
$('photo').onchange=$('cam').onchange=function(e){var f=e.target.files[0];if(!f)return;
 img0=new Image();img0.onload=function(){rot90=0;CR=null;RECT=null;picCache={};autoHid=false;$('cw').hidden=true;makeUP();refreshPhoto()};
 img0.src=URL.createObjectURL(f)};
function makeUP(){
 var W=img0.naturalWidth,H=img0.naturalHeight,u=Math.min(1,Math.sqrt(1.6e7/(W*H))),q=rot90%2,w=Math.round((q?H:W)*u),h=Math.round((q?W:H)*u);
 UP=document.createElement('canvas');UP.width=w;UP.height=h;
 var x=UP.getContext('2d');x.translate(w/2,h/2);x.rotate(rot90*Math.PI/2);x.scale(u,u);x.drawImage(img0,-W/2,-H/2)}
function previewUP(){var m=Math.min(1,1600/Math.max(UP.width,UP.height)),p=document.createElement('canvas');p.width=Math.round(UP.width*m);p.height=Math.round(UP.height*m);
 p.getContext('2d').drawImage(UP,0,0,p.width,p.height);$('pv').src=p.toDataURL('image/jpeg',0.85)}
function layout(){
 SW=$('cw').clientWidth||300;SH=Math.round(innerHeight*0.5);fit=Math.min(SW/UP.width,SH/UP.height);
 var pw=UP.width*fit,ph=UP.height*fit;PR={x:(SW-pw)/2,y:(SH-ph)/2,w:pw,h:ph};
 var st=$('stage').style,pv=$('pv').style;st.width=SW+'px';st.height=SH+'px';pv.width=pw+'px';pv.height=ph+'px';pv.left=PR.x+'px';pv.top=PR.y+'px';
 BOX=null;drawBox();applyV()}
function applyV(){$('pv').style.transform='translate('+TX+'px,'+TY+'px) rotate('+VA+'rad) scale('+VZ+')'}
function drawBox(){var b=$('box').style;if(!BOX||(BOX.w<2&&BOX.h<2)){b.display='none';return}
 b.display='block';b.left=BOX.x+'px';b.top=BOX.y+'px';b.width=BOX.w+'px';b.height=BOX.h+'px'}
var spt=function(e){var r=$('stage').getBoundingClientRect();return {x:Math.max(0,Math.min(SW,e.clientX-r.left)),y:Math.max(0,Math.min(SH,e.clientY-r.top))}};

$('stage').onpointerdown=function(e){
 this.setPointerCapture(e.pointerId);ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
 var ids=Object.keys(ptrs);
 if(ids.length==1){prevBox=BOX;drag=true;da=spt(e);BOX={x:da.x,y:da.y,w:0,h:0};drawBox()}
 else if(ids.length==2){
  if(drag){drag=false;BOX=prevBox;drawBox()}
  var a=ptrs[ids[0]],b=ptrs[ids[1]],r=$('stage').getBoundingClientRect(),
   cx=(a.x+b.x)/2-r.left-SW/2,cy=(a.y+b.y)/2-r.top-SH/2,dx=(cx-TX)/VZ,dy=(cy-TY)/VZ,ca=Math.cos(VA),sa=Math.sin(VA);
  pinch={d:Math.hypot(a.x-b.x,a.y-b.y),g:Math.atan2(b.y-a.y,b.x-a.x),z:VZ,a:VA,qx:ca*dx+sa*dy,qy:-sa*dx+ca*dy}}};
$('stage').onpointermove=function(e){
 if(!ptrs[e.pointerId])return;ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
 var ids=Object.keys(ptrs);
 if(ids.length==2&&pinch){
  var a=ptrs[ids[0]],b=ptrs[ids[1]],r=$('stage').getBoundingClientRect(),cx=(a.x+b.x)/2-r.left-SW/2,cy=(a.y+b.y)/2-r.top-SH/2;
  VZ=Math.max(0.3,Math.min(8,pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d));
  VA=pinch.a+(Math.atan2(b.y-a.y,b.x-a.x)-pinch.g);if(Math.abs(VA)<0.05)VA=0;
  var ca=Math.cos(VA),sa=Math.sin(VA);TX=cx-VZ*(ca*pinch.qx-sa*pinch.qy);TY=cy-VZ*(sa*pinch.qx+ca*pinch.qy);applyV()}
 else if(drag){var p=spt(e);BOX={x:Math.min(da.x,p.x),y:Math.min(da.y,p.y),w:Math.abs(da.x-p.x),h:Math.abs(da.y-p.y)};drawBox()}};
$('stage').onpointerup=$('stage').onpointercancel=function(e){delete ptrs[e.pointerId];if(Object.keys(ptrs).length<2)pinch=null;
 if(drag&&BOX&&(BOX.w<12||BOX.h<12)){BOX=null;drawBox()}drag=false};
function renderCrop(C,b,maxW){
 var k=C.VZ*C.fit,s=1/k,m=Math.min(1,maxW/(b.w*s)),c=document.createElement('canvas');
 c.width=Math.max(1,Math.round(b.w*s*m));c.height=Math.max(1,Math.round(b.h*s*m));
 var x=c.getContext('2d'),ca=Math.cos(C.VA),sa=Math.sin(C.VA),px=UP.width/2,py=UP.height/2;
 x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
 x.setTransform(m*ca,m*sa,-m*sa,m*ca,m*s*(C.SW/2+C.TX-b.x)-m*(ca*px-sa*py),m*s*(C.SH/2+C.TY-b.y)-m*(sa*px+ca*py));
 x.drawImage(UP,0,0);return c}
$('cropbtn').onclick=function(){
 var un=VZ==1&&VA==0&&TX==0&&TY==0,hasBox=BOX&&BOX.w>12&&BOX.h>12;
 $('cw').hidden=true;autoHid=false;picCache={};
 if(un&&!hasBox){CR=null;RECT=null;refreshPhoto();return}
 var b=hasBox?{x:BOX.x,y:BOX.y,w:BOX.w,h:BOX.h}:{x:0,y:0,w:SW,h:SH};
 CR={VZ:VZ,VA:VA,TX:TX,TY:TY,SW:SW,SH:SH,fit:fit,box:b};RECT=CR;refreshPhoto()};

$('clearall').onclick=function(){
 img0=new Image();UP=null;CR=null;RECT=null;picCache={};rot90=0;VZ=1;VA=0;TX=0;TY=0;BOX=null;autoHid=false;drawBox();
 $('cw').hidden=true;$('psec').hidden=true;$('pbox').innerHTML='';$('pv').removeAttribute('src');
 $('photo').value='';$('cam').value='';
 $('txt').value='';T='';BR={};$('out').innerHTML='';$('card').hidden=true;$('card').innerHTML='';cur=null};
function padBox(b,p){return {x:b.x-b.w*p,y:b.y-b.h*p,w:b.w*(1+2*p),h:b.h*(1+2*p)}}
function inside(t){
 var k=CR.VZ*CR.fit,ca=Math.cos(CR.VA),sa=Math.sin(CR.VA);
 return [[t.x,t.y],[t.x+t.w,t.y],[t.x,t.y+t.h],[t.x+t.w,t.y+t.h]].every(function(c){
  var dx=c[0]-CR.SW/2-CR.TX,dy=c[1]-CR.SH/2-CR.TY,X=UP.width/2+(ca*dx+sa*dy)/k,Y=UP.height/2+(-sa*dx+ca*dy)/k;
  return X>=0&&X<=UP.width&&Y>=0&&Y<=UP.height})}
function picFor(mode){
 if(!UP)return '';if(!CR)mode='original';if(picCache[mode])return picCache[mode];
 var c,g=0,h;
 if(mode=='original'){c=UP;while(c.width>SMALL_W*2&&g++<6){h=document.createElement('canvas');h.width=Math.round(c.width/2);h.height=Math.round(c.height/2);h.getContext('2d').drawImage(c,0,0,h.width,h.height);c=h}}
 else{var b=CR.box;
  if(mode=='padded'){var ps=[PAD,PAD*0.75,PAD*0.5,PAD*0.25,0],i=0;while(i<ps.length-1&&!inside(padBox(b,ps[i])))i++;b=padBox(b,ps[i])}
  c=renderCrop(CR,b,SMALL_W*2)}
 var r=Math.min(1,SMALL_W/c.width),o=document.createElement('canvas');o.width=Math.round(c.width*r);o.height=Math.round(c.height*r);
 o.getContext('2d').drawImage(c,0,0,o.width,o.height);
 return picCache[mode]=o.toDataURL('image/jpeg',SMALL_Q)}

/* ---------- audio (Lingua Libre via Wikimedia) ---------- */
async function api(p){return (await fetch('https://commons.wikimedia.org/w/api.php?origin=*&format=json&'+new URLSearchParams(p))).json()}
async function wavToMp3(blob){
 var ac=new (window.AudioContext||window.webkitAudioContext)(),buf=await ac.decodeAudioData(await blob.arrayBuffer());ac.close();
 var sr=22050,off=new OfflineAudioContext(1,Math.ceil(buf.duration*sr),sr),src=off.createBufferSource();src.buffer=buf;src.connect(off.destination);src.start();
 var f=(await off.startRendering()).getChannelData(0),pcm=new Int16Array(f.length),i;
 for(i=0;i<f.length;i++){var v=Math.max(-1,Math.min(1,f[i]));pcm[i]=v<0?v*32768:v*32767}
 var enc=new lamejs.Mp3Encoder(1,sr,32),parts=[],o;
 for(i=0;i<pcm.length;i+=1152){o=enc.encodeBuffer(pcm.subarray(i,i+1152));if(o.length)parts.push(o)}
 o=enc.flush();if(o.length)parts.push(o);
 return new Blob(parts,{type:'audio/mpeg'})}
async function findAudio(w){
 var s=await api({action:'query',list:'search',srnamespace:6,srlimit:20,srsearch:'LL-Q5287 (jpn) '+w}),
  t=s.query.search.map(function(x){return x.title.replace(/^File:/,'')}).filter(function(n){return n.endsWith('-'+w+'.wav')});
 if(!t.length)return '';
 var q=await api({action:'query',prop:'imageinfo',iiprop:'url',titles:'File:'+t[0]}),ii=Object.values(q.query.pages)[0].imageinfo[0],
  mp3=await wavToMp3(await (await fetch(ii.url)).blob());
 var h=await new Promise(function(ok){var fr=new FileReader();fr.onload=function(){ok('<audio controls src="'+fr.result+'"></audio>')};fr.readAsDataURL(mp3)});
 return h.length>40000?'':h}
function loadAudio(w){findAudio(w).then(function(h){audioC[w]=h}).catch(function(){audioC[w]=''}).then(function(){if(cur&&cur.gs&&cur.gs[cur.n].e==w)draw()})}

/* ---------- text + card ---------- */
$('txt').oninput=function(){if(UP&&!autoHid&&$('cw').hidden&&!$('psec').hidden&&!$('pbody').hidden){var y0=$('txt').getBoundingClientRect().top;setPhoto(false);autoHid=true;window.scrollBy(0,$('txt').getBoundingClientRect().top-y0)}var ls=$('txt').value.split(/[\r\n]+/).map(function(x){return x.trim()}).filter(Boolean),o=0;T=ls.join('');BR={};ls.forEach(function(x,j){if(j>0)BR[o]=true;o+=x.length});
 $('out').innerHTML=T.split('').map(function(c,i){return (i>0&&BR[i]?'<br>':'')+'<span data-i="'+i+'">'+esc(c)+'</span>'}).join('');
 $('card').hidden=true};
$('out').onclick=async function(e){
 var i=e.target.dataset.i;if(i==null||!DB)return;i=+i;
 var ms=await find(T,i);
 if(!ms.length){$('card').hidden=false;$('card').innerHTML='<p>No match</p>';return}
 cur={i:i,ms:ms};await pick(0)};
async function pick(mi){
 var m=cur.ms[mi];cur.mi=mi;
 document.querySelectorAll('#out .hl').forEach(function(x){x.classList.remove('hl')});
 for(var k=cur.i;k<cur.i+m.L;k++){var s=$('out').querySelector('[data-i="'+k+'"]');if(s)s.classList.add('hl')}
 var gs=groups(m.rows);
 for(var g of gs){var d=await meta(g.e,g.r);g.fr=d.fr;g.ps=d.ps;g.fs=fsort(d.fr)}
 gs.sort(function(a,b){return (a.fs||1e12)-(b.fs||1e12)});
 cur.gs=gs;cur.n=0;cur.sentence=sentence(cur.i,m.L);draw()}
var sp=function(p){return '<span style="display:inline;"><span>[</span><span>'+p+'</span><span>]</span></span>'};
function morae(r){var o=[];Array.from(r).forEach(function(c){if('ゃゅょぁぃぅぇぉャュョァィゥェォ'.indexOf(c)>=0&&o.length)o[o.length-1]+=c;else o.push(c)});return o}
function pcat(p,r){return p==0?'heiban':p==1?'atamadaka':p==mora(r)?'odaka':'nakadaka'}
function pitchLine(r,p){var m=morae(r),q=Math.min(p,m.length);
 return '<div class="pr">'+m.map(function(c,j){var hi=q==0?j>=1:q==1?j==0:(j>=1&&j<=q-1);
  return '<span class="pm'+(hi?' ph':'')+(q>=1&&j==q-1?' pd':'')+'">'+esc(c)+'</span>'}).join('')+' <span class="mut">['+p+'] '+pcat(p,r)+'</span></div>'}
function draw(){
 var g=cur.gs[cur.n],cat=g.ps.map(function(p){return p==0?'heiban':p==1?'atamadaka':p==mora(g.r)?'odaka':'nakadaka'}).join(',');
 if(AU&&audioC[g.e]===undefined){audioC[g.e]=null;loadAudio(g.e)}
 var au=AU?audioC[g.e]:'',pic=picFor(pm),tt=[];
 g.rows.forEach(function(r){(r.tt||'').split(' ').forEach(function(x){if(x&&tt.indexOf(x)<0)tt.push(x)})});
 var F={Expression:g.e,ExpressionFurigana:furi(g.e,g.r),ExpressionReading:g.r,Sentence:cur.sentence,MainDefinition:defn(g.rows),
  Frequency:g.fr.length?'<ul style="text-align: left;">'+g.fr.map(function(x){return '<li>'+esc(x.d)+': '+esc(x.dv)+'</li>'}).join('')+'</ul>':'',
  FreqSort:String(g.fs),
  PitchPosition:g.ps.length==1?sp(g.ps[0]):g.ps.length?'<ol>'+g.ps.map(function(p){return '<li>'+sp(p)+'</li>'}).join('')+'</ol>':'',
  PitchCategories:cat,IsClickCard:'y',Picture:pic?'<img src="'+pic+'">':'',ExpressionAudio:au||''};
 cur.F=F;
 var fd={},fo=[];g.fr.forEach(function(x){if(!fd[x.d]){fd[x.d]=[];fo.push(x.d)}fd[x.d].push(x.dv)});
 var chips='<div class="chips">'+(F.FreqSort?'<span class="fc fs">FreqSort '+esc(F.FreqSort)+'</span>':'')+fo.map(function(d){return '<span class="fc">'+esc(d)+' '+fd[d].map(esc).join(' · ')+'</span>'}).join('')+'</div>';
 var pitch=g.ps.map(function(p){return pitchLine(g.r,p)}).join('');
 var lens=cur.ms.length>1?'<div>'+cur.ms.map(function(m,j){return '<button class="t'+(j==cur.mi?' on':'')+'" data-m="'+j+'">'+esc(T.substr(cur.i,m.L))+'</button>'}).join('')+'</div>':'';
 var ents=cur.gs.length>1?'<div>'+cur.gs.map(function(x,j){return '<button class="t'+(j==cur.n?' on':'')+'" data-n="'+j+'">'+esc(x.e)+'【'+esc(x.r)+'】</button>'}).join('')+'</div>':'';
 var tags=tt.length?'<div>'+tt.map(function(x){return '<button class="tg" data-tag="'+esc(x)+'">'+esc(x)+'</button>'}).join('')+'</div><div class="mut" id="tagd"></div>':'';
 var thumb=pic?'<div class="frame"><img src="'+pic+'"></div>'+(CR?'<button class="t" data-pm="1">Photo: '+pm+' ▸</button>':''):'';
 var aud=AU?'<div class="mut">🔊 '+(au?'audio ready':au===''?'no audio found':'looking for audio…')+'</div>'+(au||''):'';
 $('card').hidden=false;
 $('card').innerHTML=lens+ents+'<h2>'+esc(g.e)+' 【'+esc(g.r)+'】</h2>'+tags+pitch+chips+aud+'<div>'+F.Sentence+'</div>'+F.MainDefinition+thumb+'<button id="send">Send to Anki</button>'}
$('card').onclick=function(e){var b=e.target.closest('button');if(!b)return;
 if(b.dataset.m!=null)pick(+b.dataset.m);
 else if(b.dataset.n!=null){cur.n=+b.dataset.n;draw()}
 else if(b.dataset.pm){pm=MODES[(MODES.indexOf(pm)+1)%3];draw()}
 else if(b.dataset.tag){var d=$('tagd'),t=b.dataset.tag+': '+(TAGS[b.dataset.tag]||'no description');d.textContent=d.textContent==t?'':t}
 else if(b.id=='send'){
  var u='anki://x-callback-url/addnote?type='+enc($('ntype').value)+'&deck='+enc($('deck').value)
   +'&x-success='+enc('anki://x-callback-url/search?query='+enc('added:1'));
  Object.keys(cur.F).forEach(function(k){if(cur.F[k]!=='')u+='&fld'+k+'='+enc(cur.F[k])});
  location.href=u}};
['deck','ntype'].forEach(function(k){try{var v=localStorage.getItem(k);if(v)$(k).value=v}catch(e){}
 $(k).onchange=function(){try{localStorage.setItem(k,$(k).value)}catch(e){}}});
openDB().then(function(d){DB=d;refresh()});
var VER='v10';$('ver').textContent='Version '+VER;
function offline(){caches.open('mining-v10').then(function(c){return c.keys()}).then(function(a){$('off').textContent=a.length?'Offline ready ('+a.length+' files saved)':'Offline not ready yet'}).catch(function(){$('off').textContent='Offline not available'})}
if('serviceWorker' in navigator){
 var had=!!navigator.serviceWorker.controller,ban=function(){$('upd').hidden=false};
 $('upd').onclick=function(){location.reload()};
 navigator.serviceWorker.addEventListener('message',function(e){if(e.data=='update')ban()});
 navigator.serviceWorker.addEventListener('controllerchange',function(){if(had)ban()});
 navigator.serviceWorker.register('sw.js').then(function(){setTimeout(offline,1500)}).catch(function(){$('off').textContent='Offline not available'});
}else $('off').textContent='Offline not supported';
