<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wikimedia audio test</title>
<style>
:root{--bg:#fff5f8;--fg:#4a3b45;--btn:#ec6f9d}
@media (prefers-color-scheme:dark){:root{--bg:#1d1519;--fg:#f3e6ec}}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,system-ui,sans-serif;padding:16px;line-height:1.6}
input,button{font-size:1rem;width:100%;box-sizing:border-box;margin:6px 0;padding:10px;border-radius:10px;border:1px solid #ccc}
button{background:var(--btn);color:#fff;border:0}
#log{white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:.85rem}
</style>
</head>
<body>
<h3>Wikimedia audio test</h3>
<input id="t" value="猫">
<button id="go">Find and download audio</button>
<div id="log"></div>
<script>
var $=function(i){return document.getElementById(i)};
function log(m){$('log').textContent+=m+'\n'}
async function api(host,p){
 var u='https://'+host+'/w/api.php?origin=*&format=json&'+new URLSearchParams(p);
 return (await fetch(u)).json()}
$('go').onclick=async function(){
 var term=$('t').value,names=[],a=new Audio();
 $('log').textContent='';
 log('Can this browser play ogg? '+(a.canPlayType('audio/ogg; codecs=vorbis')||'no')+' | wav? '+(a.canPlayType('audio/wav')||'no')+' | mp3? '+(a.canPlayType('audio/mpeg')||'no'));
 for(var host of ['ja.wiktionary.org','en.wiktionary.org']){
  try{
   var j=await api(host,{action:'parse',page:term,prop:'wikitext'}),wt=j.parse.wikitext['*'];
   var m=Array.from(wt.matchAll(/([^|=\[\]{}\n:]+\.(?:ogg|oga|wav|mp3|opus|flac))/gi)).map(function(x){return x[1].trim()});
   log(host+': '+m.length+' audio file(s) '+m.slice(0,4).join(', '));
   names=names.concat(m);
  }catch(e){log(host+': '+(e.message||'failed'))}
 }
 try{
  var s=await api('commons.wikimedia.org',{action:'query',list:'search',srnamespace:6,srlimit:5,srsearch:'LL-Q5287 (jpn) '+term});
  var ll=s.query.search.map(function(x){return x.title.replace(/^File:/,'')});
  log('Lingua Libre: '+ll.length+' file(s) '+ll.join(', '));names=names.concat(ll);
 }catch(e){log('Lingua Libre: '+(e.message||'failed'))}
 if(!names.length){log('No audio found.');return}
 var n=names[0];log('Trying: '+n);
 try{
  var q=await api('commons.wikimedia.org',{action:'query',prop:'imageinfo',iiprop:'url|size|mime',titles:'File:'+n}),
      pg=Object.values(q.query.pages)[0],ii=pg.imageinfo&&pg.imageinfo[0];
  if(!ii){log('File not found on Commons.');return}
  log('File: '+ii.mime+', '+Math.round(ii.size/1024)+' KB');
  var r=await fetch(ii.url),b=await r.blob();
  log('Download OK: '+b.size+' bytes');
  log('Embedded link would be about '+Math.round(b.size*4/3*1.1)+' characters');
  var p=new Audio(URL.createObjectURL(b));p.play().then(function(){log('Playing')}).catch(function(e){log('Play error: '+e.message)});
 }catch(e){log('Download blocked: '+(e.message||'failed'))}
};
</script>
</body>
</html>
