<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay audio test</title>
<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
<style>
:root{--bg:#fff5f8;--fg:#4a3b45;--btn:#ec6f9d}
@media (prefers-color-scheme:dark){:root{--bg:#1d1519;--fg:#f3e6ec}}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,system-ui,sans-serif;padding:16px;line-height:1.6}
input,button{font-size:1rem;width:100%;box-sizing:border-box;margin:6px 0;padding:10px;border-radius:10px;border:1px solid #ccc}
button{background:var(--btn);color:#fff;border:0}
#log{white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:.85rem}
</style>
</head>
<body>
<h3>Relay audio test</h3>
<input id="w" value="猫"><input id="r" value="ねこ">
<button id="go">Test relays</button>
<p>Tip: also try a made-up word like ぬぬぬ to see how big the "no audio" clip is.</p>
<div id="log"></div>
<script>
var $=function(i){return document.getElementById(i)},enc=encodeURIComponent;
function log(m){$('log').textContent+=m+'\n'}
var RELAYS=[
 ['corsproxy.io',function(u){return 'https://corsproxy.io/?url='+enc(u)}],
 ['allorigins',function(u){return 'https://api.allorigins.win/raw?url='+enc(u)}],
 ['codetabs',function(u){return 'https://api.codetabs.com/v1/proxy?quest='+enc(u)}]];
async function toMp3(blob){
 var ac=new (window.AudioContext||window.webkitAudioContext)(),buf=await ac.decodeAudioData(await blob.arrayBuffer());ac.close();
 var sr=22050,off=new OfflineAudioContext(1,Math.ceil(buf.duration*sr),sr),src=off.createBufferSource();src.buffer=buf;src.connect(off.destination);src.start();
 var f=(await off.startRendering()).getChannelData(0),pcm=new Int16Array(f.length),i;
 for(i=0;i<f.length;i++){var v=Math.max(-1,Math.min(1,f[i]));pcm[i]=v<0?v*32768:v*32767}
 var e=new lamejs.Mp3Encoder(1,sr,32),parts=[],o;
 for(i=0;i<pcm.length;i+=1152){o=e.encodeBuffer(pcm.subarray(i,i+1152));if(o.length)parts.push(o)}
 o=e.flush();if(o.length)parts.push(o);
 return {blob:new Blob(parts,{type:'audio/mpeg'}),sec:buf.duration}}
$('go').onclick=async function(){
 $('log').textContent='';
 var src='https://assets.languagepod101.com/dictionary/japanese/audiomp3.php?kanji='+enc($('w').value)+'&kana='+enc($('r').value),got=null;
 for(var r of RELAYS){
  try{var res=await fetch(r[1](src)),b=await res.blob();
   log(r[0]+': status '+res.status+', '+b.size+' bytes, '+(b.type||'no type'));
   if(res.ok&&b.size>1000&&!got){got=b}
  }catch(e){log(r[0]+': failed ('+(e.message||e)+')')}
 }
 if(!got){log('No relay returned audio.');return}
 try{
  var m=await toMp3(got);
  log('Shrunk: '+m.sec.toFixed(2)+' s, '+Math.round(m.blob.size/1024*10)/10+' KB');
  var fr=new FileReader();
  fr.onload=function(){log('Link length if embedded: about '+enc('<audio controls src="'+fr.result+'"></audio>').length+' characters')};
  fr.readAsDataURL(m.blob);
  new Audio(URL.createObjectURL(m.blob)).play().then(function(){log('Playing')}).catch(function(e){log('Play error: '+e.message)});
 }catch(e){log('Shrink failed: '+(e.message||e))}
};
</script>
</body>
</html>
