<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio test</title>
<style>
:root{--bg:#fff5f8;--fg:#4a3b45;--btn:#ec6f9d}
@media (prefers-color-scheme:dark){:root{--bg:#1d1519;--fg:#f3e6ec}}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,system-ui,sans-serif;padding:16px;line-height:1.6}
input,button{font-size:1rem;width:100%;box-sizing:border-box;margin:6px 0;padding:10px;border-radius:10px;border:1px solid #ccc}
button{background:var(--btn);color:#fff;border:0}
#log{white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:.85rem}
</style>
</head>
<body>
<h3>Audio test</h3>
<input id="t" value="猫"><input id="r" value="ねこ">
<button id="a">1. Download audio (fetch)</button>
<button id="b">2. Play via audio element</button>
<div id="log"></div>
<script>
var $=function(i){return document.getElementById(i)};
function url(){return 'https://assets.languagepod101.com/dictionary/japanese/audiomp3.php?kanji='+encodeURIComponent($('t').value)+'&kana='+encodeURIComponent($('r').value)}
function log(m){$('log').textContent+=m+'\n'}
$('a').onclick=async function(){
 log('Fetching...');
 try{
  var res=await fetch(url()),b=await res.blob();
  log('Download OK: '+res.status+', '+b.size+' bytes, '+b.type);
  var rd=new FileReader();
  rd.onload=function(){
   var html='<audio controls src="'+rd.result+'"></audio>';
   log('Link size if embedded: about '+encodeURIComponent(html).length+' characters');
  };
  rd.readAsDataURL(b);
  new Audio(URL.createObjectURL(b)).play().catch(function(e){log('Play error: '+e.message)});
 }catch(e){log('Download blocked: '+e.message)}
};
$('b').onclick=function(){
 new Audio(url()).play().then(function(){log('Playing via audio element')}).catch(function(e){log('Play error: '+e.message)});
};
</script>
</body>
</html>
